training:
  batch_size: 16
  block_size: 256
  learning_rate: 3.0e-5
  min_learning_rate: 1.0e-6
  weight_decay: 0.1
  max_steps: 2500
  warmup_steps: 100
  eval_interval: 100
  eval_iters: 20
  grad_clip: 1.0
  checkpoint_dir: "models"
  save_checkpoint_name: "rap_finetuned.pt"

data:
  train_data_path: "data/processed/rap_training.txt"
  val_split: 0.1
